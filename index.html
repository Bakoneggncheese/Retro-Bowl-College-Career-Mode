    <script>
        (function () {
            var reported = false;
            function reportError(event, error) {
                if (reported) return;
                reported = true;
                var message = event.message || (error && error.message) ||
                    (error ? String(error) : "The browser did not provide an error message.");
                var location = event.filename ?
                    "\nLocation: " + event.filename + ":" + event.lineno + ":" + event.colno : "";
                var stack = error && error.stack ? "\n\n" + error.stack.slice(0, 1800) : "";
                window.setTimeout(function () {
                    alert("The game reported an error (" + event.type + "):\n" +
                        message + location + stack);
                }, 0);
            }
            window.addEventListener("error", function (event) {
                reportError(event, event.error);
            });
            window.addEventListener("unhandledrejection", function (event) {
                reportError(event, event.reason);
            });
        })();
    </script>
